name: ElytrixClans
version: '${project.version}'
main: ru.rooyzee.elytrixclans.Main
api-version: '1.16'
authors: [rooyzee]
description: кланы
website: https://elytrix.pw
depend: [Vault, PlaceholderAPI, ProtocolLib]
permissions:
  elytrixclans.discount:
    default: false
  elytrixclans.admin:
    default: op
  # Разрешает использовать цветовые коды в клан-чате (по умолчанию цвета вырезаются).
  elytrixclans.chatcolor:
    default: false
commands:
  clan:
    aliases:
      - clan
  elytrixclan:
    aliases:
      - elytrixclan
    permission: elytrixclans.admin