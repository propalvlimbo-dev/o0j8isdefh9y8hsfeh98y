# Опыт клана начисляется ТОЛЬКО за убийство игроков и за ивент «Талисман»
# (внешние плагины зовут /elytrixclan addexp или ClanManager.addClanExp).
# Опыт за мобов, за добычу блоков и потеря опыта при смерти убраны полностью.
# Поинтов больше нет: в магазине валюта — обычные монеты Vault.

# Сколько опыта клан получает за убийство игрока из другого клана.
exp-for-kill: 5
# Через сколько часов повторное убийство ТОГО ЖЕ игрока снова даст опыт.
# Кулдаун хранится в kill_cooldowns.yml и переживает перезапуск сервера.
kill-exp-cooldown-hours: 12

# Кулдауны покупок в клановом магазине (персональные, на каждого игрока).
# Правило простое: чем дороже (то есть сильнее) предмет, тем дольше перезарядка.
# Длительность = цена / 1000 * seconds-per-1000-coins, с зажатием в границы min/max.
# Позиция на кулдауне показывается в витрине барьером с остатком времени.
# Любой товар/набор может переопределить это полем cooldown в shop_item.yml.
shop:
  cooldown:
    # Обычные товары: от 30 секунд до 30 минут.
    item-min-seconds: 30
    item-max-seconds: 1800
    # Наборы: не чаще раза в 15 минут, самые дорогие — раз в 2 часа.
    kit-min-seconds: 900
    kit-max-seconds: 7200
    seconds-per-1000-coins: 3.0

clan_name_min_length: 3
clan_name_max_length: 6
clan_create_price: 50000
inviteExit: 15

