# Ассортимент кланового магазина ElytrixClans.
#
# Валюта — обычные монеты экономики Vault (поинтов в плагине больше нет).
# Слоты не указываются: товары раскладываются по страницам автоматически.
# Порядок витрины: по уровню клана, внутри уровня — товары по цене, затем набор этого уровня.
#
# Поля позиции:
#   material  — материал предмета (он же иконка для командных позиций)
#   amount    — количество
#   price     — цена в монетах Vault
#   level     — с какого уровня клана позиция доступна (1..10).
#               Недоступные позиции показываются БАРЬЕРОМ с подписью нужного уровня.
#   cooldown  — персональный кулдаун покупки в секундах. Если не указан, считается
#               автоматически от цены (см. секцию shop.cooldown в config.yml):
#               чем дороже предмет, тем дольше перезарядка. На кулдауне позиция
#               тоже показывается барьером с остатком времени.
#   lore      — описание в витрине
#   commands  — консольные команды выдачи (%player% = ник покупателя).
#               Если они заданы, предмет НЕ выдаётся напрямую: работают только команды.
#   enchant / stored-enchant / unbreakable / damage / flags / potion-type /
#   potion-extended / potion-upgraded / potion-effects / potion-color / leather-color
#             — свойства предмета (см. ShopItemMeta)

