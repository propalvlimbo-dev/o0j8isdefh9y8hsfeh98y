# Ассортимент кланового магазина ElytrixClans.
#
# ЦЕНЫ УДОБНЕЕ МЕНЯТЬ В ОТДЕЛЬНОМ ФАЙЛЕ shop/prices.yml:
# он короткий, содержит только «id: цена» и переопределяет значения отсюда.
#
# В магазине продаются ТОЛЬКО ванильные ресурсы и расходники.
# Броня и оружие продаются исключительно в составе наборов (секция kits ниже),
# особых предметов других плагинов в магазине нет.
#
# Валюта — обычные монеты экономики Vault.
# Слоты не указываются: товары раскладываются по страницам автоматически.
# Порядок витрины: по уровню клана, внутри уровня — товары по цене, затем набор этого уровня.
#
# Поля позиции:
#   name      — название в витрине. Описания (lore) намеренно нет: предмет говорит сам за
#               себя, а магазин показывает цену, количество и уровень. Нужно описание —
#               добавьте список lore, он будет показан.
#   material  — материал предмета
#   amount    — количество
#   price     — цена в монетах Vault
#   level     — с какого уровня клана позиция доступна (1..10).
#               Закрытые позиции показываются барьером и не раскрывают, что за предмет
#               под ними спрятан: видно только нужный уровень клана.
#   cooldown  — персональный кулдаун покупки в секундах. Если не указан, считается
#               автоматически от цены (см. секцию shop.cooldown в config.yml).
#               Позиция на перезарядке показывается зачарованными часами с остатком времени.
#   enchant / stored-enchant / unbreakable / damage / flags / potion-type /
#   potion-extended / potion-upgraded / potion-effects / potion-color / leather-color
#             — свойства предмета (см. ShopItemMeta)

