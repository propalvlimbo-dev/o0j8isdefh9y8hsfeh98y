name: Build ElytrixTalisman

# Талисман собирается ОТДЕЛЬНО и вручную: ему нужны VirtualEntityApi и BLib из
# стороннего репозитория repo.by1337.space. Если он недоступен, сборка талисмана
# упадёт — и это не должно ронять сборку основного плагина кланов.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 для талисмана
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Талисман компилируется против кланов: в libs лежит устаревший jar,
      # поэтому сначала собираем кланы и кладём свежий на его место.
      - name: Java 8 и сборка кланов
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Собрать кланы
        run: mvn -B -ntp clean package

      - name: Подложить свежий jar кланов
        run: cp target/ElytrixClans.jar ElytrixTalisman/libs/ElytrixClans-1.0.jar

      - name: Вернуть Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Собрать талисман
        run: mvn -B -ntp -f ElytrixTalisman/pom.xml clean package

      - name: Положить jar в build/
        run: |
          mkdir -p build
          cp ElytrixTalisman/target/ElytrixTalisman.jar build/ElytrixTalisman.jar

      - name: Закоммитить jar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/ElytrixTalisman.jar
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Сборка: ElytrixTalisman.jar [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
