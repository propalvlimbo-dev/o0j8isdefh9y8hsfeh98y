name: Build ElytrixClans

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0bcd1-o0j8isdefh9y8hsfeh98y

permissions:
  contents: write

jobs:
  clans:
    name: ElytrixClans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Собрать
        run: mvn -B -ntp clean package

      - name: Положить jar в build/
        run: |
          mkdir -p build
          cp target/ElytrixClans.jar build/ElytrixClans.jar

      - name: Закоммитить jar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp build/ElytrixClans.jar /tmp/ElytrixClans.jar
          git fetch origin ${GITHUB_REF_NAME}
          git reset --hard origin/${GITHUB_REF_NAME}
          mkdir -p build
          cp /tmp/ElytrixClans.jar build/ElytrixClans.jar
          git add -f build/ElytrixClans.jar
          if git diff --cached --quiet; then
            echo "jar не изменился"
            exit 0
          fi
          git commit -m "Сборка: ElytrixClans.jar [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

  talisman:
    name: ElytrixTalisman
    needs: clans
    runs-on: ubuntu-latest
    # Талисману нужны VirtualEntityApi и BLib со стороннего repo.by1337.space.
    # Если репозиторий недоступен, это не должно ронять всю сборку.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Java 8 для кланов
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # В libs лежит jar кланов от 11 августа, в нём нет TalismanRewards.
      # Собираем кланы заново и подкладываем свежий.
      - name: Собрать кланы и подложить в libs
        run: |
          mvn -B -ntp clean package
          cp target/ElytrixClans.jar ElytrixTalisman/libs/ElytrixClans-1.0.jar

      - name: Java 17 для талисмана
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Собрать талисман
        run: mvn -B -ntp -f ElytrixTalisman/pom.xml clean package

      - name: Закоммитить jar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ElytrixTalisman/target/ElytrixTalisman.jar /tmp/ElytrixTalisman.jar
          git fetch origin ${GITHUB_REF_NAME}
          git reset --hard origin/${GITHUB_REF_NAME}
          mkdir -p build
          cp /tmp/ElytrixTalisman.jar build/ElytrixTalisman.jar
          git add -f build/ElytrixTalisman.jar
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Сборка: ElytrixTalisman.jar [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
