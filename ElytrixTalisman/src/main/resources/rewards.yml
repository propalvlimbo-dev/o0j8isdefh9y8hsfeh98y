# Размеры наград за талисман задаются НЕ здесь.
#
# Опыт клана, личный вклад участников и монеты настраиваются в config.yml плагина
# ElytrixClans, секция talisman.places (отдельно на 1, 2 и 3 место). Так сделано,
# чтобы одни и те же числа не были прописаны в двух плагинах сразу.
#
# Прежний ключ points ссылался на клановые поинты, которых больше нет: валюта одна —
# монеты Vault.
#
# Здесь осталась только настройка количества награждаемых мест, и та в config.yml
# (ключ reward-places). Файл сохранён, чтобы старые сборки не падали при чтении.
