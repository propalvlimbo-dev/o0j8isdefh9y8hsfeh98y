world: "world"
remove-schematic-on-end: true
schematic-name: "totem.schem"
schematic-offset:
  x: 0
  y: 50
  z: 0
search-area:
  x-radius: 1000
  z-radius: 1000
  min-y: 60
capture:
  max-bank: 1000
  points-per-standing: 1
  points-per-kill: 10
  tick-interval: 20
talisman:
  block: "BEACON"
  block-offset:
    x: 1
    y: 50
    z: 3
  capture-radius: 10
  hologram-height: 1
  totem-radius: 1.0
  totem-rotation-speed: 0.08
  totem-height-offset: 0
  totem-explode-power: 3.0
  totem-explode-damage: 10.0
  particle-radius: 1.5
  particle-count: 20
loot:
  points-per-drop: 100
  items-per-player: 2
# Сколько мест награждается. Размеры наград задаются НЕ здесь, а в config.yml
# плагина ElytrixClans (секция talisman.places) — чтобы опыт и монеты не были
# прописаны в двух местах сразу.
reward-places: 3
stop-countdown: 10
disable-god: true
disable-fly: true
min-online: 10
postpone-minutes: 30