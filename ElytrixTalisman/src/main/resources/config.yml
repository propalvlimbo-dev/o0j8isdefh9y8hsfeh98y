world: "world"
remove-schematic-on-end: true
# Обрушение башни в конце ивента — рваное, сверху вниз.
# У каждой колонки своя высота фронта, поэтому кромка осыпается неровно.
# layers-per-tick — средняя глубина обрушения за шаг (реальная колеблется вокруг неё),
# tick-interval   — пауза между шагами в тиках (20 тиков = 1 секунда),
# jitter          — разброс стартовой кромки в блоках: больше = рванее начало.
# Значения ниже дают неспешное обрушение секунд на 15-20 для башни в 40 блоков.
demolish:
  layers-per-tick: 1
  tick-interval: 12
  jitter: 6
schematic-name: "totem.schem"
schematic-offset:
  x: 0
  y: 50
  z: 0
search-area:
  x-radius: 1000
  z-radius: 1000
  min-y: 60
capture:
  max-bank: 1000
  points-per-standing: 1
  points-per-kill: 10
  tick-interval: 20
talisman:
  block: "BEACON"
  block-offset:
    x: 1
    y: 50
    z: 3
  capture-radius: 10
  hologram-height: 1
  particle-radius: 1.5
  particle-count: 20
loot:
  points-per-drop: 100
  items-per-player: 2
# Сколько мест награждается. Размеры наград задаются НЕ здесь, а в config.yml
# плагина ElytrixClans (секция talisman.places) — чтобы опыт и монеты не были
# прописаны в двух местах сразу.
reward-places: 3

# Предельная длительность ивента в минутах, 0 — без ограничения.
# Страховка: банк умеет убывать (смерть без убийцы откатывает захват), поэтому при
# активных самоубийствах прогресс может стоять на месте. По истечении времени
# талисман завершается с тем, что накоплено.
max-duration-minutes: 30
disable-god: true
disable-fly: true
min-online: 10
postpone-minutes: 30