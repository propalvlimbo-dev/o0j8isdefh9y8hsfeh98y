prefix: "&f☁ &#F8BEFBᴇ&#F6BEFBʟ&#F3BEFBʏ&#F1BFFBᴛ&#EEBFFBʀ&#ECBFFBɪ&#E9BFFBx &7»"

start:
  - ""
  - "%prefix% &#F8BEFBТалисман появился!"
  - "&#F8BEFB&l┃ &fКоординаты: &#F8BEFB%x% %y% %z%"
  - "&#F8BEFB&l┃ &fЗахватывайте территорию и убивайте врагов"
  - "&#F8BEFB&l┃ &fТоп 3 клана получат &#F8BEFBкоины &fи &#F8BEFBопыт"
  - ""

# Итог ивента. Шлётся ОДИН раз, а не по строке на каждый клан.
# %top% — готовый список мест, собранный плагином из reward-line.
reward-summary:
  - "%prefix% &#F8BEFBТалисман захвачен"
  - "%top%"
# Строка одного места: %place% %clan% %points% %exp% %money%
reward-line-1: "&8 &e① &f%clan% &8· &7%points% очк. &8· &a+%exp% опыта&8, &a%money%⛃"
reward-line-2: "&8 &7② &f%clan% &8· &7%points% очк. &8· &a+%exp% опыта&8, &a%money%⛃"
reward-line-3: "&8 &c③ &f%clan% &8· &7%points% очк. &8· &a+%exp% опыта&8, &a%money%⛃"
# Если талисман никто не захватил.
reward-nobody: "%prefix% &7Талисман угас: его никто не захватил"

not-enough-online:
  - ""
  - "%prefix% &cНедостаточно игроков для запуска ивента"
  - "&#F8BEFB&l┃ &fОнлайн: &c%online%&8/&#F8BEFB%required%"
  - "&#F8BEFB&l┃ &fПеренос на: &#F8BEFB%minutes% мин."
  - ""

no-leader: "&7Отсутствует"

# %bank%/%max_bank% — общий прогресс ивента, %score% — личные очки игрока.
# Личные очки — ставка: убийца из другого клана забирает их себе вместе с кланом.
actionbar: "&fЗахват: &#F8BEFB%bank%&8/&#F8BEFB%max_bank%   &8|   &fВаши очки: &#F8BEFB%score%"
actionbar-no-clan: "&cВы не состоите в клане"

# Очки захвата при смерти. %killer% %victim% %points%
score-stolen: "%prefix% &a+%points% &fочков захвата &8(&f%victim%&8)"
score-lost: "%prefix% &c-%points% &fочков — их забрал &#F8BEFB%killer%"
# Смерть без убийцы: упал, лава, моб, /kill. Очки исчезают полностью — и у игрока,
# и у клана, и из общего прогресса ивента.
score-burned: "%prefix% &c-%points% &fочков захвата сгорело"

# Табло над талисманом. Строки идут сверху вниз.
# %top1% %top2% %top3% — строки топа кланов, уже собранные плагином.
# Пока никто не захватывает, вместо строки подставляется top-empty.
hologram:
  - "&#F8BEFB&lТАЛИСМАН"
  - "%top1%"
  - "%top2%"
  - "%top3%"
  - "&8До лута: &7%points%"

# Одна строка топа. %place% — место, %clan% — клан, %points% — его очки.
# Цвет у каждого места свой, чтобы лидер читался с одного взгляда.
top-line-1: "&e①&f %clan% &8— &e%points%"
top-line-2: "&7②&f %clan% &8— &7%points%"
top-line-3: "&c③&f %clan% &8— &c%points%"
# Показывается на месте строки, пока его никто не занял.
top-empty: "&8· · ·"

loot:
  menu-title: "&#F8BEFBЛут талисмана"
  next-page: "&#F8BEFB&lСледующая страница"
  previous-page: "&#F8BEFB&lПредыдущая страница"
  page-info: "&fСтраница: &#F8BEFB%current%&8/&#F8BEFB%total%"
  no-items: "&cПул пуст"
  drop-broadcast: "%prefix% &#F8BEFBВыпал лут! &fПредметов: &#F8BEFB%amount%"

admin:
  event-already-running: "%prefix% &cИвент уже запущен!"
  event-not-running: "%prefix% &cИвент не найден!"
  event-started: "%prefix% &aИвент был успешно запущен!"
  event-stopped: "%prefix% &aИвент был успешно завершён!"
  reloaded: "%prefix% &aКонфигурация перезагружена!"
  teleported: "%prefix% &aТелепортация к талисману!"
  no-active-session: "%prefix% &cНет активной сессии!"
  console-denied: "%prefix% &cТолько для игроков!"
  items-opened: "%prefix% &aМеню лута открыто"
  info:
    - "%prefix% &#F8BEFBИнформация"
    - "&#F8BEFB&l┃ &fСтатус: &#F8BEFB%status%"
    - "&#F8BEFB&l┃ &fКоординаты: &#F8BEFB%x% %y% %z%"
    - "&#F8BEFB&l┃ &fБанк: &#F8BEFB%bank%&8/&#F8BEFB%max_bank%"
    - "&#F8BEFB&l┃ &fЛидер: &#F8BEFB%leader%"
    - "&#F8BEFB&l┃ &fКланов участвует: &#F8BEFB%clan_count%"

status-active: "&aАктивен"
status-inactive: "&cНеактивен"