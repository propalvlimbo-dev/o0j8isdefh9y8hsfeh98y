# Табло над талисманом. Строки идут сверху вниз.
# %top1% %top2% %top3% — строки топа кланов, уже собранные плагином.
# Пока никто не захватывает, вместо строки подставляется top-empty.
hologram:
  - "&#F8BEFB&lТАЛИСМАН"
  - "%top1%"
  - "%top2%"
  - "%top3%"
  - "&8До лута: &7%points%"

# Одна строка топа. %place% — место, %clan% — клан, %points% — его очки.
# Цвет у каждого места свой, чтобы лидер читался с одного взгляда.
top-line-1: "&e①&f %clan% &8— &e%points%"
top-line-2: "&7②&f %clan% &8— &7%points%"
top-line-3: "&c③&f %clan% &8— &c%points%"
